name: Deploy Quiet World to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Unpack the mobile site
        run: |
          unzip -q site.zip -d published
          test -s published/index.html
          test -s published/manifest.webmanifest
          test -s published/service-worker.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: published
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
